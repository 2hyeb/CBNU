<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="auto" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #2c3e50; }
