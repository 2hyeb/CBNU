<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" height="auto" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #2c3e50; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .label { font-size: 14px; font-weight: 700; fill: #2c3e50; }
      .small { font-size: 11px; fill: #6b7280; }
      .caption { font-size: 13px; fill: #374151; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect width="920" height="470" fill="#FEFCFB"/>

  <text x="460" y="38" text-anchor="middle" class="title">Yuseong Pothole Risk — Block × Month Panel 구조</text>
  <text x="460" y="58" text-anchor="middle" class="subtitle">공간 분할 × 시간 축 × 다층 피처 → 다음 달 블록별 위험도</text>

  <g transform="translate(60, 110)">
    <text x="95" y="0" text-anchor="middle" class="label">공간 — 도로 블록</text>
    <text x="95" y="18" text-anchor="middle" class="small">10m · 100m · 200m 서브섹션</text>

    <g stroke="#2c3e50" stroke-opacity="0.25" stroke-width="0.8">
      <rect x="0" y="35" width="32" height="22" fill="#D4F1E4"/>
      <rect x="32" y="35" width="32" height="22" fill="#D4F1E4"/>
      <rect x="64" y="35" width="32" height="22" fill="#FFB4A2"/>
      <rect x="96" y="35" width="32" height="22" fill="#D4F1E4"/>
      <rect x="128" y="35" width="32" height="22" fill="#D4F1E4"/>
      <rect x="160" y="35" width="32" height="22" fill="#FFE4D6"/>

      <rect x="0" y="57" width="32" height="22" fill="#D4F1E4"/>
      <rect x="32" y="57" width="32" height="22" fill="#FFB4A2"/>
      <rect x="64" y="57" width="32" height="22" fill="#FFE4D6"/>
      <rect x="96" y="57" width="32" height="22" fill="#D4F1E4"/>
      <rect x="128" y="57" width="32" height="22" fill="#FFE4D6"/>
      <rect x="160" y="57" width="32" height="22" fill="#D4F1E4"/>

      <rect x="0" y="79" width="32" height="22" fill="#FFE4D6"/>
      <rect x="32" y="79" width="32" height="22" fill="#D4F1E4"/>
      <rect x="64" y="79" width="32" height="22" fill="#D4F1E4"/>
      <rect x="96" y="79" width="32" height="22" fill="#FFB4A2"/>
      <rect x="128" y="79" width="32" height="22" fill="#D4F1E4"/>
      <rect x="160" y="79" width="32" height="22" fill="#D4F1E4"/>

      <rect x="0" y="101" width="32" height="22" fill="#D4F1E4"/>
      <rect x="32" y="101" width="32" height="22" fill="#FFE4D6"/>
      <rect x="64" y="101" width="32" height="22" fill="#D4F1E4"/>
      <rect x="96" y="101" width="32" height="22" fill="#D4F1E4"/>
      <rect x="128" y="101" width="32" height="22" fill="#FFB4A2"/>
      <rect x="160" y="101" width="32" height="22" fill="#D4F1E4"/>

      <rect x="0" y="123" width="32" height="22" fill="#FFE4D6"/>
      <rect x="32" y="123" width="32" height="22" fill="#D4F1E4"/>
      <rect x="64" y="123" width="32" height="22" fill="#D4F1E4"/>
      <rect x="96" y="123" width="32" height="22" fill="#D4F1E4"/>
      <rect x="128" y="123" width="32" height="22" fill="#D4F1E4"/>
      <rect x="160" y="123" width="32" height="22" fill="#D4F1E4"/>
    </g>

    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="12" height="12" fill="#FFB4A2"/>
      <text x="18" y="10" class="small">High</text>
      <rect x="60" y="0" width="12" height="12" fill="#FFE4D6"/>
      <text x="78" y="10" class="small">Mid</text>
      <rect x="115" y="0" width="12" height="12" fill="#D4F1E4"/>
      <text x="133" y="10" class="small">Low risk</text>
    </g>
  </g>

  <g transform="translate(290, 200)">
    <line x1="0" y1="0" x2="130" y2="0" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="65" y="-15" text-anchor="middle" class="label">시간</text>
    <text x="65" y="22" text-anchor="middle" class="small">월 단위 롤링</text>
    <text x="65" y="40" text-anchor="middle" class="small">t → t+1</text>
  </g>

  <g transform="translate(460, 110)">
    <text x="190" y="0" text-anchor="middle" class="label">피처 레이어</text>
    <text x="190" y="18" text-anchor="middle" class="small">block × month 셀마다 결합</text>

    <rect x="0" y="35" width="380" height="32" rx="4" fill="#CDE4FD"/>
    <text x="18" y="56" class="caption">🌦  기상 롤링 — 30d · 90d</text>

    <rect x="0" y="75" width="380" height="32" rx="4" fill="#FFE4D6"/>
    <text x="18" y="96" class="caption">🛣  OSM 도로망 — HIGHWAY · ROAD_LEVEL</text>

    <rect x="0" y="115" width="380" height="32" rx="4" fill="#D4F1E4"/>
    <text x="18" y="136" class="caption">🚗  교통량 Proxy</text>

    <rect x="0" y="155" width="380" height="32" rx="4" fill="#E5D5F2"/>
    <text x="18" y="176" class="caption">📍  과거 포트홀 이벤트 (sjoin_nearest)</text>
  </g>

  <g transform="translate(180, 405)">
    <rect width="560" height="40" rx="10" fill="#2c3e50"/>
    <text x="280" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="700">XGBoost · LightGBM → 다음 달 블록별 포트홀 발생 위험도</text>
  </g>
</svg>
